# Render Blueprint (https://render.com/docs/blueprint-spec): the static site
# that serves Clatter, as created with the Render CLI (see README, Deploying).
# Check edits with: render blueprints validate render.yaml
#
# The site builds from the release branch. GitHub Actions moves that branch
# forward only after the full suite (typecheck, unit tests, Playwright with
# axe) passes on main, so Render never serves a build the accessibility checks
# have not approved.
services:
  - type: web
    name: clatter
    runtime: static
    repo: https://github.com/tre-wolf-scinta/clatter
    branch: release
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
